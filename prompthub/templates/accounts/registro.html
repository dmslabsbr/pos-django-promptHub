{% extends "base.html" %}

{% block title %}Criar conta{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="text-center mb-4">
      <h1 class="section-title">Criar conta</h1>
      <p class="text-muted-ph">Junte-se à comunidade PromptHub</p>
    </div>

    <div class="card shadow-lg" style="border: 1px solid rgba(14, 165, 233, 0.2);">
      <div class="card-body p-4">
        <form method="post" novalidate>
          {% csrf_token %}

          {% for field in form %}
          <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
            <div class="invalid-feedback d-block">{{ error }}</div>
            {% endfor %}
          </div>
          {% endfor %}

          <button type="submit" class="btn-primary-ph btn w-100 mt-2 py-2">
            <i class="bi bi-person-plus me-2"></i>Criar conta
          </button>
        </form>
      </div>
    </div>

    <p class="text-center text-muted-ph small mt-3">
      Já tem conta? <a href="{% url 'accounts:login' %}">Entrar</a>
    </p>
  </div>
</div>

{% endblock %}

services:

  db:
    image: postgres:16-alpine
    container_name: prompthub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-prompthub}
      POSTGRES_USER: ${DB_USER:-prompthub}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: prompthub-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application -c gunicorn.conf.py"

volumes:
  postgres_data:
